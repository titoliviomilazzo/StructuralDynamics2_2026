# GitHub Pages 설정 — 사이트 루트는 이 docs/ 폴더
title: 응용동역학 2026 가을
description: 초고층내진계약학과 · GitHub 수업 워크플로우

# 마크다운 문서 안의 상대 .md 링크를 Pages URL로 자동 변환
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 사이트로 내보내지 않을 것
exclude:
  - _config.yml
